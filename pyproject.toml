[project]
name = "editora"
version = "0.1.0"
description = "Editora pessoal automatizada para produção de livros profissionais"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Dan", email = "dan@example.com"}
]
keywords = ["editora", "livros", "pandoc", "markdown", "pdf", "epub"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "pypandoc>=1.12",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.9",
    "pyright>=1.1.350",
    "black>=23.12.1",
]
ui = [
    "streamlit>=1.29.0",
]

[project.scripts]
editora = "editora.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.black]
line-length = 100
target-version = ["py312"]