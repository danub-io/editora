# Editora - Arquivo de Configuração de Exemplo
# Copie para editora.yaml e personalize

# ============================================
# METADADOS DO LIVRO
# ============================================
book:
  title: "Meu Livro Incrível"
  author: "Seu Nome"
  language: "pt-BR"
  isbn: null  # Adicione se tiver ISBN
  description: null
  categories:
    - Ficção
    - Fantasia
  keywords:
    - aventura
    - magia
  copyright_year: "2026"
  edition: "1"
  publisher: null

# ============================================
# CONFIGURAÇÕES DE DIAGRAMAÇÃO (TYPESETTING)
# ============================================
typesetting:
  # Formatos de saída: pdf, epub, both
  format: both

  # Tamanho da página (padrão KDP: 6x9 polegadas)
  # Opções: A5, 6x9, 5x8, 5.5x8.5
  page_size: 6x9

  # Fonte principal
  font_family: Georgia

  # Tamanho da fonte (pontos)
  font_size: 11

  # Espaçamento entre linhas
  line_height: 1.4

  # Margens (para livros impressos, inner > outer para encadernação)
  margins:
    top: 2cm
    bottom: 2cm
    inner: 2.5cm  # Margem interna (lombo)
    outer: 2cm    # Margem externa

  # Tamanho da fonte para cabeçalhos
  header_font_size: 14

  # Incluir sumário automático
  include_toc: true

  # Incluir numeração de páginas
  include_page_numbers: true

  # Template personalizado (deixe null para usar o padrão)
  template: null

# CONFIGURAÇÕES DE SAÍDA
# ============================================
output:
  # Diretório para arquivos gerados
  output_dir: output

  # Diretório para versionamento do manuscrito
  versions_dir: versions

  # Manter arquivos intermediários (Markdown compilado, etc.)
  keep_intermediate: false

  # Validar compatibilidade com KDP (Kindle Direct Publishing)
  kdp_compliant: true

# ============================================
# CONFIGURAÇÕES GERAIS
# ============================================

# Diretório do projeto (padrão: diretório atual)
project_dir: .

# Diretório dos capítulos (relativo ao project_dir)
chapters_dir: chapters

# Diretório de recursos/imagens (relativo ao project_dir)
assets_dir: assets

# Modo debug (mais logs e informações)
debug: false

# Modo verbose (output detalhado)
verbose: false

# ============================================
# EXEMPLOS DE USO
# ============================================
#
# Iniciar novo projeto:
#   editora init --title "Meu Livro" --author "Seu Nome"
#
# Compilar livro:
#   editora build
#   editora build --format pdf
#
# ============================================